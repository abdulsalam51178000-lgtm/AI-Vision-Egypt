
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Vision Egypt</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<style>
body {
  font-family: Arial;
  background: #071b35;
  color: white;
  text-align: center;
  padding: 15px;
}
h1 { color: gold; }
button {
  background: #d5a52b;
  color: #071b35;
  border: 0;
  padding: 15px 25px;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
}
#camera { margin: 20px auto; }
#result {
  font-size: 23px;
  color: gold;
  margin: 20px;
}
#status { color: white; }
</style>
</head>

<body>

<h1>🇪🇬 AI Vision Egypt</h1>
<h3>المرشد السياحي الذكي</h3>

<button id="startButton" onclick="startCamera()">
تشغيل الكاميرا
</button>

<div id="camera"></div>
<div id="status">اضغط تشغيل الكاميرا للبدء</div>
<div id="result">في انتظار التعرف على الأثر...</div>

<script>
const MODEL_URL =
"https://teachablemachine.withgoogle.com/models/CvfTSTcqR/";

let model;
let webcam;
let running = false;
let lastSpoken = "";
let lastSpeakTime = 0;

function speakArabic(message) {
  if (!("speechSynthesis" in window)) {
    document.getElementById("status").textContent =
      "المتصفح لا يدعم النطق الصوتي";
    return;
  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(message);
  speech.lang = "ar-EG";
  speech.rate = 0.9;
  speech.pitch = 1;

  window.speechSynthesis.speak(speech);
}

async function startCamera() {
  if (running) return;

  try {
    document.getElementById("status").textContent =
      "جاري تحميل الذكاء الاصطناعي...";

    model = await tmImage.load(
      MODEL_URL + "model.json",
      MODEL_URL + "metadata.json"
    );

    webcam = new tmImage.Webcam(400, 300, true);

    await webcam.setup();
    await webcam.play();

    document.getElementById("camera").innerHTML = "";
    document.getElementById("camera").appendChild(webcam.canvas);

    running = true;

    document.getElementById("status").textContent =
      "الكاميرا تعمل بنجاح";

    speakArabic("مرحباً بك في المرشد السياحي الذكي لمصر");

    window.requestAnimationFrame(loop);

  } catch (error) {
    console.error(error);
    document.getElementById("status").textContent =
      "حدث خطأ: " + error.message;
  }
}

async function loop() {
  if (!running) return;

  webcam.update();
  await predict();

  window.requestAnimationFrame(loop);
}

async function predict() {
  const predictions = await model.predict(webcam.canvas);

  predictions.sort((a, b) => b.probability - a.probability);

  const best = predictions[0];
  const confidence = Math.round(best.probability * 100);

  if (confidence >= 75) {
    document.getElementById("result").textContent =
      "الأثر المكتشف: " + best.className +
      " (" + confidence + "%)";

    const now = Date.now();

    if (
      best.className !== lastSpoken ||
      now - lastSpeakTime > 6000
    ) {
      lastSpoken = best.className;
      lastSpeakTime = now;

      speakArabic("هذا الأثر هو " + best.className);
    }

  } else {
    document.getElementById("result").textContent =
      "لم يتم التعرف على أثر بوضوح";
  }
}
</script>

</body>
</html>
