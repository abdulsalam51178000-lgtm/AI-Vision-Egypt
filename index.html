
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Vision Egypt</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #10243a;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #e7bd65;
    }

    #webcam-container {
      margin: 20px auto;
      width: 100%;
      max-width: 400px;
    }

    canvas {
      width: 100%;
      height: auto;
      border: 3px solid #e7bd65;
      border-radius: 12px;
    }

    button {
      background: #d6a94d;
      color: #10243a;
      border: none;
      padding: 13px 25px;
      margin: 8px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    #status {
      margin: 15px;
      color: #ffffff;
    }

    #result {
      background: #1b3855;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      font-size: 20px;
    }
  </style>

  <!-- TensorFlow.js يجب أن يُحمّل قبل Teachable Machine -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
</head>

<body>

  <h1>AI Vision Egypt</h1>
  <p>اكتشف الآثار المصرية باستخدام الذكاء الاصطناعي</p>

  <button onclick="init()">تشغيل الكاميرا</button>
  <button onclick="stopCamera()">إيقاف الكاميرا</button>

  <p id="status">اضغط على تشغيل الكاميرا للبدء</p>

  <div id="webcam-container"></div>

  <div id="result">
    نتيجة التعرف ستظهر هنا
  </div>

  <script>
    const URL = "https://teachablemachine.withgoogle.com/models/CvfTSTcqR/";

    let model = null;
    let webcam = null;
    let running = false;
    let starting = false;

    async function init() {
      if (running || starting) return;

      starting = true;

      const status = document.getElementById("status");
      const result = document.getElementById("result");

      try {
        status.innerText = "جارٍ تحميل المكتبات والنموذج...";
        result.innerText = "انتظر قليلاً...";

        if (typeof tf === "undefined") {
          throw new Error("مكتبة TensorFlow لم يتم تحميلها. تحقق من اتصال الإنترنت.");
        }

        if (typeof tmImage === "undefined") {
          throw new Error("مكتبة Teachable Machine لم يتم تحميلها.");
        }

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error("المتصفح لا يدعم الكاميرا هنا. افتح الرابط في Chrome باستخدام HTTPS.");
        }

        model = await tmImage.load(
          URL + "model.json",
          URL + "metadata.json"
        );

        webcam = new tmImage.Webcam(400, 300, true);

        await webcam.setup({
          facingMode: "environment"
        });

        await webcam.play();

        document.getElementById("webcam-container").innerHTML = "";
        document.getElementById("webcam-container")
          .appendChild(webcam.canvas);

        running = true;
        starting = false;

        status.innerText = "الكاميرا تعمل بنجاح!";
        window.requestAnimationFrame(loop);

      } catch (error) {
        starting = false;
        running = false;

        if (webcam) {
          try {
            webcam.stop();
          } catch (e) {}
          webcam = null;
        }

        status.innerText = "حدث خطأ: " + error.message;
        result.innerText = "تعذر تشغيل الكاميرا أو النموذج.";

        console.error("Camera error:", error);
      }
    }

    async function loop() {
      if (!running || !webcam) return;

      webcam.update();
      await predict();

      if (running) {
        window.requestAnimationFrame(loop);
      }
    }

    async function predict() {
      if (!model || !webcam) return;

      const predictions = await model.predict(webcam.canvas);

      predictions.sort((a, b) =>
        b.probability - a.probability
      );

      const best = predictions[0];

      document.getElementById("result").innerText =
        "التعرف على: " + best.className +
        " — نسبة الثقة: " +
        (best.probability * 100).toFixed(1) + "%";
    }

    function stopCamera() {
      running = false;
      starting = false;

      if (webcam) {
        try {
          webcam.stop();
        } catch (e) {}
        webcam = null;
      }

      document.getElementById("webcam-container").innerHTML = "";
      document.getElementById("status").innerText = "تم إيقاف الكاميرا";
      document.getElementById("result").innerText =
        "نتيجة التعرف ستظهر هنا";
    }
  </script>

</body>
</html>
