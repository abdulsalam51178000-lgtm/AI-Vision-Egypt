<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AI Vision Egypt</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<style>
body {
  background: #101d30;
  color: white;
  text-align: center;
  font-family: Arial;
}
h2 { color: gold; }
#camera { margin: auto; }
#result { font-size: 22px; color: gold; }
</style>
</head>

<body>

<h2>AI Vision Egypt</h2>
<p>وجّه الكاميرا نحو الأثر</p>

<div id="camera"></div>
<h3 id="result">جاري تشغيل الكاميرا...</h3>

<script>
const URL =
"https://teachablemachine.withgoogle.com/models/CvfTSTcqR/";

let model;
let webcam;
let lastResult = "";

async function startCamera() {
  try {
    model = await tmImage.load(
      URL + "model.json",
      URL + "metadata.json"
    );

    webcam = new tmImage.Webcam(320, 320, true);

    await webcam.setup();
    await webcam.play();

    document.getElementById("camera").appendChild(
      webcam.canvas
    );

    window.requestAnimationFrame(loop);

  } catch (error) {
    document.getElementById("result").innerText =
      "تعذر تشغيل الكاميرا: " + error.message;
  }
}

async function loop() {
  webcam.update();
  await predict();
  window.requestAnimationFrame(loop);
}

async function predict() {
  const predictions = await model.predict(webcam.canvas);

  predictions.sort((a, b) =>
    b.probability - a.probability
  );

  const best = predictions[0];

  if (best.probability >= 0.70) {
    const name = best.className;

    document.getElementById("result").innerText =
      "الأثر هو: " + name + " - " +
      (best.probability * 100).toFixed(1) + "%";

    if (name !== lastResult) {
      lastResult = name;

      if (window.AppInventor) {
        window.AppInventor.setWebViewString(name);
      }
    }
  }
}

startCamera();
</script>

</body>
</html>
